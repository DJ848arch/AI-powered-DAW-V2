name: M3 QA

on:
  push:
    branches: [m3-desktop-mixer]
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 numpy pytest pytest-qt pydub soundfile librosa requests python-dotenv
      - name: Focused M3 tests
        run: python -m pytest tests/test_mixer_widget.py tests/test_metering_ui.py -q
      - name: Full regression suite
        run: python -m pytest tests/ -q
      - name: ARIA M3 smoke test
        run: |
          python - <<'PY'
          from PyQt6.QtWidgets import QApplication
          from main_window import MainWindow

          app = QApplication.instance() or QApplication([])
          win = MainWindow()
          tid = win.track_panel.add_track("Smoke")
          win.timeline.add_track(tid)
          win.audio_engine.add_bus("smoke-bus")
          win._sync_mixer()

          strip = win.mixer_widget.strips[("track", tid)]
          strip.fader.setValue(61)
          strip.insert_type.setCurrentText("gain")
          strip._add_insert()
          for i in range(strip.send_dest.count()):
              if strip.send_dest.itemData(i) == "smoke-bus":
                  strip.send_dest.setCurrentIndex(i)
                  break
          strip._add_send()
          win._refresh_meters()

          assert win.audio_engine.track_volumes[tid] == 0.61
          assert win.audio_engine.get_inserts(tid)
          assert "smoke-bus" in win.audio_engine.get_sends(tid)
          assert ("master", "master") in win.mixer_widget.strips
          win.close()
          print("ARIA M3 SMOKE: PASS")
          PY
